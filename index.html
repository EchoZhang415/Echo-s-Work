<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>向上 · 班级任务看板</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">↗</span><div>向上 <small>CLASSROOM BOARD</small></div></div><div class="headright"><span id="saved">● 本机自动保存</span><button id="backup">备份全部班级</button><button id="restore">恢复备份</button><button id="screen" class="dark">⛶ 大屏模式</button></div></header>
<main><section class="intro"><div><div class="eyebrow">EVERY SMALL STEP COUNTS</div><h1><span id="className">我的班级</span><button id="rename" class="icon" aria-label="修改班级名称">✎</button><span class="thin">任务看板</span></h1><p>让每一份努力，都被看见。</p></div><div class="date" id="date"></div></section>
<nav class="classbar" aria-label="班级切换"><div id="classTabs"></div><span>两个班级独立记录 · 点击班级名称切换</span></nav><section class="stats"><article><span>班级人数</span><strong id="nStudents">0<small>人</small></strong><i>一起向上，共同成长</i></article><article><span>进行中任务</span><strong id="nTasks">0<small>项</small></strong><i>每个目标，都有回应</i></article><article><span>整体完成率 <em>含优秀</em></span><strong id="rate">0<small>%</small></strong><div class="progress"><b id="bar"></b></div></article><article class="gold"><span>优秀表现</span><strong id="nExcellent">0<small>次 ✧</small></strong><i>认真，让成长闪闪发光</i></article></section>
<section class="board"><div class="toolbar"><div><h2>任务总览 <span id="demoBadge" hidden>示例数据</span></h2><p>点击状态切换：未完成 → 完成 → 优秀</p></div><div class="actions"><button id="import">↥ 导入名单</button><button id="add" class="primary">＋ 添加任务</button></div></div><div class="filters"><input id="search" placeholder="⌕ 搜索学生姓名" aria-label="搜索学生"><div class="legend"><span>○ 未完成</span><span class="green">✓ 完成</span><span class="amber">★ 优秀</span></div><div class="tools"><label><input type="checkbox" id="compact"> 紧凑显示</label><button id="undo" disabled>撤销</button><button id="csv">导出成绩表</button></div></div><div id="tableWrap"></div><footer><span id="foot">先导入名单，开始记录课堂里的每一步。</span><span>优秀计入已完成 · 数据保存在当前浏览器</span></footer></section><div class="bottom"><span>GROW QUIETLY. BLOOM BRIGHTLY.</span><button id="demo">体验示例</button><button id="manage">管理学生</button><button id="exit" hidden>退出大屏</button></div></main>
<dialog id="modal"><form method="dialog" id="form"><div class="modalhead"><h2 id="modalTitle"></h2><button value="cancel" aria-label="关闭">×</button></div><div id="modalBody"></div><div class="modalfoot"><button value="cancel">取消</button><button id="confirm" value="default" class="primary">确认</button></div></form></dialog><input type="file" id="file" accept=".csv,.txt" hidden><input type="file" id="json" accept=".json" hidden><div id="toast" role="status"></div><script src="app.js"></script></body></html>
